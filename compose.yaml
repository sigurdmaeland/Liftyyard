# Lokal utviklingsdatabase og e-post. Start med: docker compose up -d
# Verdiene hentes fra .env (kopi av .env.example).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # PostgreSQL 18-imaget lagrer data under /var/lib/postgresql/<versjon>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fanger opp all e-post lokalt (innloggingskoder). Se e-postene på http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
